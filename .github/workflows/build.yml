name: Build APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Build APK
        run: |
          flutter pub get 2>&1 | tee build-output.log
          flutter build apk --debug 2>&1 | tee -a build-output.log
          if grep -qi "error\|failed\|failure\|could not" build-output.log; then
            echo "::error::Build failed - errors detected in logs"
            exit 1
          fi
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: build-output.log
          retention-days: 1
      - name: Trigger IA
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-fix.yml',
              ref: context.ref,
              inputs: {
                run_id: '${{ github.run_id }}'
              }
            });
