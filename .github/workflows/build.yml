name: Build APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Build APK
        id: build_step
        run: |
          flutter pub get 2>&1 | tee build-output.log
          flutter build apk --debug 2>&1 | tee -a build-output.log
        continue-on-error: true
      - name: Check build status
        id: check
        run: |
          if grep -qi "error\|failed\|failure\|could not" build-output.log; then
            echo "BUILD_FAILED=true" >> $GITHUB_OUTPUT
          fi
      - name: Upload logs
        if: steps.check.outputs.BUILD_FAILED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build-output.log
          retention-days: 1
      - name: Trigger IA
        if: steps.check.outputs.BUILD_FAILED == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'auto-fix.yml',
              ref: context.ref,
            });
