name: Build FridgeAI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Try to compile (verbose)
        run: flutter build apk --debug --verbose || true

      - name: Show last 100 lines of error log
        run: |
          echo "📄 Dernières 100 lignes du log :"
          tail -n 100 /home/runner/.gradle/daemon/*/daemon.log || echo "Log introuvable"
